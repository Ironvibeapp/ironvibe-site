<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support IronVibe</title>
    <meta name="robots" content="noindex, follow">
    <script>
        (function() {
            var supported = ['en','ru','ar','de','es','fr','hi','it','pt','zh'];
            var lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0].toLowerCase();
            var locale = supported.indexOf(lang) !== -1 ? lang : 'en';
            window.location.replace('/' + locale + '/#support');
        })();
    </script>
</head>
<body>
    <p><a href="/en/#support">Support IronVibe</a></p>
</body>
</html>
