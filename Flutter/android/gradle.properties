org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Flutter 3.41 still applies kotlin-android and the legacy android DSL.
# AGP 9 enables built-in Kotlin and the new DSL by default; opt out until Flutter is upgraded.
android.builtInKotlin=false
android.newDsl=false

# Play Console: optimized unused resource shrinking (default on AGP 9 when shrinkResources is on).
android.r8.optimizedResourceShrinking=true
