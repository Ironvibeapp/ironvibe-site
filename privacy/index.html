<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy — IronVibe</title>
    <link rel="icon" href="../favicon.ico?v=21" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=21">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=21">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <script>
        (function () {
            var SUPPORTED = ['en', 'ru', 'de', 'es', 'fr', 'it', 'pt', 'zh', 'ar', 'hi'];
            var DEFAULT = 'en';
            function primaryCode(tag) {
                if (!tag) return null;
                var s = String(tag).trim().split(',')[0].trim().toLowerCase();
                if (!s) return null;
                var i = s.indexOf('-');
                return i === -1 ? s : s.slice(0, i);
            }
            var list = [];
            try {
                if (navigator.languages && navigator.languages.length) {
                    list = Array.prototype.slice.call(navigator.languages);
                } else if (navigator.language) {
                    list = [navigator.language];
                }
            } catch (e) {}
            var locale = DEFAULT;
            for (var j = 0; j < list.length; j++) {
                var code = primaryCode(list[j]);
                if (code && SUPPORTED.indexOf(code) >= 0) {
                    locale = code;
                    break;
                }
            }
            var tail = (location.search || '') + (location.hash || '');
            location.replace('/' + locale + '/privacy/' + tail);
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=/en/privacy/">
    </noscript>
</head>
<body style="font-family: system-ui, sans-serif; margin: 2rem; color: #444;">
    <p>If you are not redirected, open the <a href="/en/privacy/">Privacy Policy in English</a> or <a href="/ru/privacy/">на русском</a>.</p>
</body>
</html>
